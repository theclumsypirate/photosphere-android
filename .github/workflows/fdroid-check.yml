name: fdroid-check

# Validates that the app stays publishable on F-Droid: no proprietary
# dependencies, an unsigned release build works (F-Droid signs with its
# own key), and the store listing files are present and within limits.
# Runs on pull requests and manually. Publishing itself still happens
# through a merge request to F-Droid's fdroiddata repo, not here.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fdroid-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Refuse proprietary dependencies
        shell: bash
        run: |
          if grep -rin "play-services\|com.google.android.gms\|firebase\|crashlytics\|mapbox\|facebook" \
              app/build.gradle.kts gradle/libs.versions.toml settings.gradle.kts app/src/main/AndroidManifest.xml; then
            echo "::error::Proprietary dependency or tracker found. F-Droid forbids these."
            exit 1
          fi
          echo "No proprietary dependencies."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Unsigned, like F-Droid builds it: no keystore secrets passed, so the
      # release signing block stays empty and F-Droid can sign with its key.
      - name: Assemble unsigned release APKs
        run: ./gradlew :app:assembleRelease -PonlyAbi=arm64-v8a,armeabi-v7a

      - name: Verify store listing files
        shell: bash
        run: |
          test "$(wc -c < fastlane/metadata/android/en-US/title.txt | tr -d ' ')" -le 31 || {
            echo "::error::title.txt over 30 chars."; exit 1; }
          test "$(wc -c < fastlane/metadata/android/en-US/short_description.txt | tr -d ' ')" -le 81 || {
            echo "::error::short_description.txt over 80 chars."; exit 1; }
          ls app/build/outputs/apk/release/*.apk
          grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts
          grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts
          echo "F-Droid check passed."
