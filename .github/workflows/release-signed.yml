name: release-signed

# Manual SIGNED releases, starting at 0.0.1-beta. Assembles a signed release
# APK with the keystore from CI secrets and attaches only the APK to the
# GitHub Release (no mapping.txt). Runs only on manual dispatch.
# Secrets needed: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# (keystore). Release creation uses softprops/action-gh-release with the
# built-in GITHUB_TOKEN; no PAT needed.
#
# Two things this file is careful about, because both bit before:
#
#   The version is written into the build file before the build, so the APK
#   carries it, but it is committed and tagged only after the build succeeds.
#   A run that is cancelled or fails therefore leaves no tag and consumes no
#   version number.
#
#   Everything the run prints is written to three places the browser shows
#   without a download: the run summary, the release body, and a log
#   artifact. The job log alone is not enough, because a run that dies during
#   a long Gradle build is exactly the run whose tail nobody can read.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Beta prerelease or stable release"
        type: choice
        options: [beta, stable]
        default: beta
      version:
        description: "Version to release, empty takes the next one from the tags"
        type: string
        default: ""
      notes:
        description: "Release notes (optional)"
        type: string
        default: ""
      beta_as_release:
        description: "Publish beta tags as full releases instead of prereleases"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-signed
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: photosphere-release.jks
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      BUILD_LOG: build.log

    steps:
      # The first thing the run does is leave a mark, so the run page is never
      # a blank panel while the build is still going.
      - name: Start
        run: |
          # No add-mask here on purpose. A value that comes from the secret
          # store is already masked by GitHub when the step is expanded, so
          # the runner would receive the mask itself and reject it. The real
          # risk is the log that goes into the release body: that one is a
          # file, not a log line, so it is scrubbed before it is published.
          {
            echo "# Release run ${{ github.run_number }}"
            echo
            echo "- started $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- commit ${{ github.sha }}"
            echo "- actor ${{ github.actor }}"
            echo "- type ${{ inputs.release_type }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Release run ${{ github.run_number }} started, see the summary for the result."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstitute keystore from secret
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is empty. Set it in Settings -> Secrets -> Actions."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          ls -la "$KEYSTORE_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate keystore and passwords (fail fast)
        shell: bash
        run: |
          set -euo pipefail
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The keystore could not be opened with the stored store password."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -q "$KEY_ALIAS"; then
            echo "::error::The stored key alias is not in the keystore."
            exit 1
          fi
          # Sign a throwaway jar with the key password. This is the only way
          # to tell a wrong key password from a wrong store password. The
          # jar is signed in place, the way the release build signs the APK.
          KEYPASS="$KEY_PASSWORD"
          [ -z "$KEYPASS" ] && KEYPASS="$KEYSTORE_PASSWORD"
          tmp="$(mktemp -d)"
          echo test > "$tmp/f.txt"
          (cd "$tmp" && jar cf t.jar f.txt)
          if ! jarsigner -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYPASS" \
            "$tmp/t.jar" "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The stored key password does not match the stored key."
            exit 1
          fi
          rm -rf "$tmp"
          echo "Keystore, passwords and alias: OK"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_VERSION: ${{ inputs.version }}
          BETA_AS_RELEASE: ${{ inputs.beta_as_release }}
        run: |
          set -euo pipefail
          greater() {
            printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1
          }
          bump() {
            echo "$1" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}'
          }
          max_beta=""
          max_stable=""
          for t in $(git tag --list 'v*'); do
            if [[ "$t" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-beta$ ]]; then
              v="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              if [ -z "$max_beta" ]; then max_beta="$v"; else max_beta=$(greater "$max_beta" "$v"); fi
            elif [[ "$t" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              v="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              if [ -z "$max_stable" ]; then max_stable="$v"; else max_stable=$(greater "$max_stable" "$v"); fi
            fi
          done
          if [ -n "$INPUT_VERSION" ]; then
            # An explicit version wins over the tags. It still has to be a
            # version and not a tag, the workflow adds the v itself.
            next="${INPUT_VERSION#v}"
            next="${next%-beta}"
            if [ "$RELEASE_TYPE" = beta ]; then
              name="$next-beta"
              tag="v$next-beta"
              if [ "$BETA_AS_RELEASE" = "true" ]; then
                prerelease=false
              else
                prerelease=true
              fi
            else
              name="$next"
              tag="v$next"
              prerelease=false
            fi
          elif [ "$RELEASE_TYPE" = beta ]; then
            if [ -z "$max_beta" ]; then next="0.0.1"; else next=$(bump "$max_beta"); fi
            tag="v$next-beta"
            name="$next-beta"
            if [ "$BETA_AS_RELEASE" = "true" ]; then
              prerelease=false
            else
              prerelease=true
            fi
          else
            if [ -n "$max_beta" ] && [ "$max_beta" != "$max_stable" ]; then
              next="$max_beta"
            elif [ -n "$max_stable" ]; then
              next=$(bump "$max_stable")
            else
              next="0.0.1"
            fi
            tag="v$next"
            name="$next"
            prerelease=false
          fi
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          code=$((code + 1))
          if [ -z "$INPUT_NOTES" ]; then
            notes="Signed $RELEASE_TYPE release $tag."
          else
            notes="$INPUT_NOTES"
          fi
          # Fail before the build, not after it. A tag that is already there
          # means the version was released before, and pushing it again would
          # need a force push, which this repo does not do.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::The tag $tag already exists. Delete it (git push origin :refs/tags/$tag) or pick another version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$notes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (versionCode $code, prerelease $prerelease)"

      # The version goes into the build file now, so the APK carries it, but
      # nothing is committed yet. The commit and the tag happen only after the
      # build succeeded, so a cancelled run burns no version.
      - name: Write the version into the build file
        run: |
          set -euo pipefail
          sed -i "s/versionCode = .*/versionCode = ${{ steps.version.outputs.code }}/" app/build.gradle.kts
          sed -i 's/versionName = ".*"/versionName = "${{ steps.version.outputs.name }}"/' app/build.gradle.kts
          grep -n "versionCode\|versionName" app/build.gradle.kts

      - name: Assemble signed release APKs (arm64-v8a, armeabi-v7a)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease -PonlyAbi=arm64-v8a,armeabi-v7a \
            -PkeystorePath="$GITHUB_WORKSPACE/$KEYSTORE_PATH" \
            -PkeystorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD" 2>&1 | tee "$BUILD_LOG"

      - name: Prepare release assets
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.name }}"
          FILES=""
          SIZES=""
          for ABI in arm64-v8a armeabi-v7a; do
            SRC_APK="$(ls app/build/outputs/apk/release/*${ABI}*.apk | head -1)"
            APK="photosphere_android_v${VERSION}_${ABI}.apk"
            cp "$SRC_APK" "$APK"
            SIZE="$(du -h "$APK" | cut -f1)"
            echo "APK: $APK ($SIZE)"
            if ! unzip -tqq "$APK"; then
              echo "::error::$APK is not a valid APK."
              exit 1
            fi
            FILES="${FILES}${APK}"$'\n'
            SIZES="${SIZES}- ${APK} (${SIZE})"$'\n'
          done
          echo "apks<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s' "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "sizes<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s' "$SIZES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # The body of the release is the version and nothing else. The notes,
      # the files and the build log belong to the run, and the run summary
      # is where the browser shows them.
      - name: Write the release body
        id: body
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ steps.version.outputs.tag }}" > release-body.md
          cat release-body.md
          # The log that goes into the run summary is scrubbed of the
          # secrets first. GitHub masks a secret in the log it shows, but a
          # file is not a log line, so the text is cleaned before it is used.
          python3 - <<'PY'
          import os

          names = ("KEYSTORE_PASSWORD", "KEY_PASSWORD", "KEY_ALIAS",
                   "KEYSTORE_BASE64", "KEYSTORE_PATH")
          secrets = [os.environ.get(name, "") for name in names]
          try:
              with open(os.environ.get("BUILD_LOG", "build.log"),
                        encoding="utf-8", errors="replace") as fh:
                  lines = fh.readlines()
          except OSError:
              lines = []
          clean = []
          for line in lines:
              for secret in secrets:
                  if secret:
                      line = line.replace(secret, "***")
              clean.append(line)
          with open("build-tail.txt", "w", encoding="utf-8") as fh:
              fh.writelines(clean[-60:] if clean else ["(no log)\n"])
          print("scrubbed %d log lines" % len(clean))
          PY
          {
            echo
            echo "### Files"
            echo
            echo "${{ steps.asset.outputs.sizes }}"
            echo
            echo "### Build log, the last lines"
            echo
            echo '```'
            cat build-tail.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only now, with a built and signed APK in hand, does the version get
      # committed and tagged. Before this point a cancelled run leaves
      # nothing behind.
      - name: Commit and tag the release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin main "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Photo Sphere v${{ steps.version.outputs.name }}
          body_path: release-body.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: ${{ steps.asset.outputs.apks }}

      # The keystore and the raw log leave the runner with the job. The
      # keystore is not needed past the signing, and the raw log may hold a
      # secret in a form GitHub cannot mask, because a file is not a log line.
      - name: Remove the keystore and the raw log
        if: always()
        shell: bash
        run: |
          rm -f "$KEYSTORE_PATH" "$BUILD_LOG" build-tail.txt
          echo "keystore and raw build log removed from the runner"
