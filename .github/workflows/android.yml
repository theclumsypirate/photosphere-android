name: build-debug

# Builds the debug APKs. The APKs are uploaded as workflow artifacts, so a
# device can be tested against without a local Android SDK: download, unzip,
# `adb install`. Runs only manually or on pull requests, never on push.
#
# The Gradle output is also written to the run summary and to a log artifact,
# because the run page alone is hard to read when the build is long.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_LOG: build-debug.log

    steps:
      - name: Start
        run: |
          {
            echo "# Debug build ${{ github.run_number }}"
            echo
            echo "- started $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- commit ${{ github.sha }}"
            echo "- actor ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Debug build ${{ github.run_number }} started, see the summary for the result."

      - uses: actions/checkout@v4

      # AGP 8.7.3 targets JDK 17; the module compiles Java and Kotlin at 17 too.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an SDK, but this pins the packages the
      # build needs and accepts the licences non-interactively.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # arm64-v8a only: the ABI every modern phone runs. The OpenCV AAR still
      # carries native libraries for all ABIs, but only this split is packaged.
      # --info so the next "unable to strip" line says exactly why.
      - name: Assemble debug APK (arm64-v8a)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug -PonlyAbi=arm64-v8a --info 2>&1 | tee "$BUILD_LOG"

      - name: Write the summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "### APK"
            echo
            for apk in app/build/outputs/apk/debug/*arm64-v8a*.apk; do
              echo "- $(basename "$apk") ($(du -h "$apk" | cut -f1))"
            done
            echo
            echo "### Build log, the last lines"
            echo
            echo '```'
            tail -n 60 "$BUILD_LOG" 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-debug-apk-arm64
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
